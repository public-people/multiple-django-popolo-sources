[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "multiple-django-popolo-sources"
version = "0.1.0"
description = "Handle django-popolo data from multiple separate sources"
readme = {file = "README.rst", content-type = "text/x-rst"}
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
authors = [
    {name = "Mark Longair", email = "mark@mysociety.org"},
]
keywords = ["django", "popolo", "civic-tech"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    # django-popolo is intentionally not listed here: this package is used
    # with the public-people fork, which must be installed separately.
    "Django>=6.1",
    "requests>=2.34.2",
]

[dependency-groups]
test = [
    "coverage>=7.17.0",
    "mysociety-django-popolo",
]

[tool.uv.sources]
mysociety-django-popolo = { git = "https://github.com/public-people/django-popolo.git", branch = "public-people" }

[tool.setuptools.packages.find]
include = ["popolo_sources*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"popolo_sources.tests" = ["fixtures/*.json"]

[tool.coverage.run]
source = ["popolo_sources"]

[tool.coverage.report]
show_missing = true
skip_covered = true
